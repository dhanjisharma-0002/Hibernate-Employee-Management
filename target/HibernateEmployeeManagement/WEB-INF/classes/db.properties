# ==============================================================================
# Database Configuration for Employee Management Application
# ==============================================================================
# IMPORTANT: Update 'db.password' with your local MySQL root password.
# Do NOT hardcode production secrets in public repositories.
# ==============================================================================

# JDBC Driver
db.driver=com.mysql.cj.jdbc.Driver

# Database Connection URL (Database: hibernate_employee_db)
db.url=jdbc:mysql://localhost:3306/hibernate_employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true

# Database Credentials
db.username=root
db.password=admin@123

# Hibernate ORM 6 Specific Properties
# MySQLDialect is the modern dialect for MySQL in Hibernate 6
db.dialect=org.hibernate.dialect.MySQLDialect

# Show SQL queries in server console during development
db.show_sql=true
db.format_sql=true

# Schema management: 'update' will create or update tables automatically
# Options: validate | update | create | create-drop
db.hbm2ddl.auto=update
